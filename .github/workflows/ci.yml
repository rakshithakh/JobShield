name: CI
on:
  push: { branches: [main, fullstack-rewrite] }
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: jobsentinel, POSTGRES_PASSWORD: testpw, POSTGRES_DB: jobsentinel_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jobsentinel" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults: { run: { working-directory: backend } }
    env:
      TEST_POSTGRES_URL: postgresql+psycopg://jobsentinel:testpw@localhost:5432/jobsentinel_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements-dev.lock }
      - run: pip install -r requirements-dev.lock
      - run: ruff check .
      - run: mypy app
      - name: Migrations apply and match the models (no drift)
        run: alembic upgrade head && alembic check
        env: { DATABASE_URL: "postgresql+psycopg://jobsentinel:testpw@localhost:5432/jobsentinel_test" }
      - run: pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: pip install -r backend/requirements.lock pytest playwright && python -m playwright install --with-deps chromium
      - run: npm ci
        working-directory: frontend
      - run: bash e2e/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: e2e-screenshots, path: docs/screenshots }
