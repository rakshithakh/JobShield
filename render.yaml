# Render blueprint (NOT deployed or verified by the author). Review before use.
services:
  - type: web
    name: jobsentinel-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.lock
    startCommand: alembic upgrade head && uvicorn app.main:create_app --factory --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - { key: PYTHON_VERSION, value: "3.12.3" }
      - { key: ENVIRONMENT, value: production }
      - { key: TRUSTED_PROXY_COUNT, value: "1" }
      - { key: CORS_ORIGINS, sync: false }      # e.g. https://your-app.vercel.app
      - { key: DATABASE_URL, fromDatabase: { name: jobsentinel-db, property: connectionString } }
      - { key: RATE_LIMIT_BACKEND, value: database }
      - { key: ADZUNA_APP_ID, sync: false }
      - { key: ADZUNA_APP_KEY, sync: false }
databases:
  - name: jobsentinel-db
    plan: free # demo only: free Render Postgres expires after 30 days; use a persistent plan for production data
